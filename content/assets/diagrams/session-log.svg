<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" fill="none">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1100" height="680" rx="12" fill="#0f172a"/>
  <text x="550" y="36" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="system-ui">Session Log — one transcript, many projections</text>

  <!-- Invariant badge -->
  <rect x="60" y="56" width="980" height="40" rx="8" fill="#3b1e2e" stroke="#EF4444" stroke-width="1.4"/>
  <text x="550" y="81" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold" font-family="system-ui">runtime invariant: anything model-visible is reconstructable from the log</text>

  <!-- LOG column -->
  <g font-family="system-ui">
    <rect x="60" y="112" width="330" height="472" rx="10" fill="#1e3a5f" opacity="0.35" stroke="#3B82F6" stroke-width="1.6"/>
    <text x="80" y="136" fill="#93c5fd" font-size="11" font-weight="bold">the log · append-only, like a court transcript</text>
    <text x="80" y="152" fill="#64748b" font-size="9">lossless JSON · sequence numbers stay contiguous</text>

    <!-- event rows -->
    <rect x="80" y="166" width="290" height="34" rx="6" fill="#0f1f33" stroke="#3B82F6" stroke-width="1"/>
    <text x="96" y="187" fill="#e2e8f0" font-size="9.5">1 · turn/start</text>

    <rect x="80" y="208" width="290" height="34" rx="6" fill="#0f1f33" stroke="#3B82F6" stroke-width="1"/>
    <text x="96" y="229" fill="#e2e8f0" font-size="9.5">2 · user/message — input on the log</text>

    <rect x="80" y="250" width="290" height="34" rx="6" fill="#0f1f33" stroke="#EF4444" stroke-width="1"/>
    <text x="96" y="271" fill="#fca5a5" font-size="9.5">3 · assistant/chunk ×n — verbatim transcript</text>

    <rect x="80" y="292" width="290" height="34" rx="6" fill="#0f1f33" stroke="#EF4444" stroke-width="1"/>
    <text x="96" y="313" fill="#fca5a5" font-size="9.5">4 · assistant/message — carries usage</text>

    <rect x="80" y="334" width="290" height="34" rx="6" fill="#0f1f33" stroke="#3B82F6" stroke-width="1"/>
    <text x="96" y="355" fill="#e2e8f0" font-size="9.5">5 · tool/result — guarded execution</text>

    <rect x="80" y="376" width="290" height="34" rx="6" fill="#0f1f33" stroke="#3B82F6" stroke-width="1"/>
    <text x="96" y="397" fill="#e2e8f0" font-size="9.5">6 · step/end · turn/end</text>

    <!-- append arrow -->
    <path d="M 225 426 C 225 452 225 470 350 470 L 350 470" stroke="#3B82F6" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
    <text x="225" y="448" text-anchor="middle" fill="#93c5fd" font-size="9">appended, never rewritten</text>
  </g>

  <!-- Projections -->
  <g font-family="system-ui">
    <text x="560" y="136" fill="#94a3b8" font-size="11" font-weight="bold">every consumer derives from the same stream (derive-not-store)</text>

    <!-- projection 1: model history -->
    <rect x="560" y="152" width="480" height="56" rx="8" fill="#1e293b" stroke="#8B5CF6" stroke-width="1.4"/>
    <text x="800" y="174" text-anchor="middle" fill="#c4b5fd" font-size="10">deriveMessages() → model history</text>
    <text x="800" y="192" text-anchor="middle" fill="#64748b" font-size="8.5">the context the model sees · chapter 5</text>

    <!-- projection 2: UI -->
    <rect x="560" y="220" width="480" height="56" rx="8" fill="#1e293b" stroke="#10B981" stroke-width="1.4"/>
    <text x="800" y="242" text-anchor="middle" fill="#6ee7b7" font-size="10">UI renders from raw chunks</text>
    <text x="800" y="260" text-anchor="middle" fill="#64748b" font-size="8.5">token-level fidelity, live</text>

    <!-- projection 3: telemetry -->
    <rect x="560" y="288" width="480" height="56" rx="8" fill="#1e293b" stroke="#F59E0B" stroke-width="1.4"/>
    <text x="800" y="310" text-anchor="middle" fill="#fcd34d" font-size="10">telemetry consumes token streams</text>
    <text x="800" y="328" text-anchor="middle" fill="#64748b" font-size="8.5">usage + timings from the same events</text>

    <!-- projection 4: fork / resume -->
    <rect x="560" y="356" width="480" height="56" rx="8" fill="#1e293b" stroke="#3B82F6" stroke-width="1.4"/>
    <text x="800" y="378" text-anchor="middle" fill="#93c5fd" font-size="10">fork · resume · transcripts</text>
    <text x="800" y="396" text-anchor="middle" fill="#64748b" font-size="8.5">replay the same canonical log</text>

    <!-- projection 5: persistence -->
    <rect x="560" y="424" width="480" height="56" rx="8" fill="#1e293b" stroke="#EF4444" stroke-width="1.4"/>
    <text x="800" y="446" text-anchor="middle" fill="#fca5a5" font-size="10">persistence stores the log verbatim</text>
    <text x="800" y="464" text-anchor="middle" fill="#64748b" font-size="8.5">no second private copy of history</text>

    <!-- arrows from log to projections -->
    <line x1="390" y1="180" x2="556" y2="180" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
    <line x1="390" y1="248" x2="556" y2="248" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
    <line x1="390" y1="316" x2="556" y2="316" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
    <line x1="390" y1="384" x2="556" y2="384" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
    <line x1="390" y1="452" x2="556" y2="452" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  </g>

  <!-- What breaks if you inject directly -->
  <g font-family="system-ui">
    <rect x="60" y="600" width="980" height="52" rx="8" fill="#0b1526" stroke="#475569" stroke-width="1.2"/>
    <text x="80" y="620" fill="#fca5a5" font-size="10" font-weight="bold">the tempting shortcut: inject context straight into the model request</text>
    <text x="80" y="638" fill="#64748b" font-size="9">creates a second, unlogged path → breaks replay · telemetry · persistence · audit</text>
    <line x1="225" y1="584" x2="225" y2="596" stroke="#EF4444" stroke-width="1.4" marker-end="url(#arrow-red)"/>
  </g>

  <!-- Takeaway -->
  <text x="550" y="668" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui">Ask of any feature: how does this reach the model — and is it on the log?</text>
</svg>