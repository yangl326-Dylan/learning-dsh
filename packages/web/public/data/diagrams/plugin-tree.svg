<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" fill="none">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1100" height="640" rx="12" fill="#0f172a"/>
  <text x="550" y="36" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="system-ui">Everything Is a Plugin — no privileged core</text>

  <!-- Central shared context -->
  <rect x="350" y="270" width="400" height="120" rx="12" fill="#1e293b" stroke="#3B82F6" stroke-width="2"/>
  <text x="550" y="300" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="bold" font-family="system-ui">shared Context (ctx)</text>
  <text x="550" y="322" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui">a service directory — find services by key</text>
  <text x="550" y="342" text-anchor="middle" fill="#64748b" font-size="9.5" font-family="system-ui">ctx.tools · ctx.llm · ctx.sessions · ctx.agents · ctx.agentLoop · ctx.systemPrompt</text>
  <text x="550" y="362" text-anchor="middle" fill="#475569" font-size="9" font-family="system-ui">inject: ['tools', 'llm', …] — handed to plugins at load time</text>

  <!-- Plugins: top row (3) -->
  <g font-family="system-ui">
    <rect x="80" y="90" width="260" height="78" rx="10" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1.4"/>
    <text x="210" y="120" text-anchor="middle" fill="#93c5fd" font-size="12.5" font-weight="bold">Model Adapter</text>
    <text x="210" y="140" text-anchor="middle" fill="#94a3b8" font-size="9.5">plugin · claims ctx.llm</text>
    <text x="210" y="156" text-anchor="middle" fill="#64748b" font-size="8.5">talks to the model</text>
    <line x1="260" y1="168" x2="390" y2="270" stroke="#3B82F6" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

    <rect x="420" y="90" width="260" height="78" rx="10" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1.4"/>
    <text x="550" y="120" text-anchor="middle" fill="#93c5fd" font-size="12.5" font-weight="bold">Tool Registry</text>
    <text x="550" y="140" text-anchor="middle" fill="#94a3b8" font-size="9.5">plugin · claims ctx.tools</text>
    <text x="550" y="156" text-anchor="middle" fill="#64748b" font-size="8.5">what the model can call</text>
    <line x1="550" y1="168" x2="550" y2="268" stroke="#3B82F6" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

    <rect x="760" y="90" width="260" height="78" rx="10" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1.4"/>
    <text x="890" y="120" text-anchor="middle" fill="#93c5fd" font-size="12.5" font-weight="bold">Agent Loop</text>
    <text x="890" y="140" text-anchor="middle" fill="#94a3b8" font-size="9.5">plugin · claims ctx.agentLoop</text>
    <text x="890" y="156" text-anchor="middle" fill="#64748b" font-size="8.5">the thinking loop itself</text>
    <line x1="840" y1="168" x2="710" y2="270" stroke="#3B82F6" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- Plugins: middle row (2, flanking) -->
  <g font-family="system-ui">
    <rect x="80" y="330" width="220" height="78" rx="10" fill="#1e3a5f" stroke="#10B981" stroke-width="1.4"/>
    <text x="190" y="360" text-anchor="middle" fill="#6ee7b7" font-size="12.5" font-weight="bold">Session Log</text>
    <text x="190" y="380" text-anchor="middle" fill="#94a3b8" font-size="9.5">plugin · claims ctx.sessions</text>
    <text x="190" y="396" text-anchor="middle" fill="#64748b" font-size="8.5">the conversation record</text>
    <line x1="300" y1="390" x2="348" y2="388" stroke="#10B981" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

    <rect x="800" y="330" width="220" height="78" rx="10" fill="#1e3a5f" stroke="#8B5CF6" stroke-width="1.4"/>
    <text x="910" y="360" text-anchor="middle" fill="#c4b5fd" font-size="12.5" font-weight="bold">System Prompt</text>
    <text x="910" y="380" text-anchor="middle" fill="#94a3b8" font-size="9.5">plugin · claims ctx.systemPrompt</text>
    <text x="910" y="396" text-anchor="middle" fill="#64748b" font-size="8.5">the base instructions</text>
    <line x1="800" y1="390" x2="752" y2="388" stroke="#8B5CF6" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- Plugins: bottom row (3) -->
  <g font-family="system-ui">
    <rect x="80" y="500" width="260" height="78" rx="10" fill="#1e3a5f" stroke="#F59E0B" stroke-width="1.4"/>
    <text x="210" y="530" text-anchor="middle" fill="#fcd34d" font-size="12.5" font-weight="bold">Agent Registry</text>
    <text x="210" y="550" text-anchor="middle" fill="#94a3b8" font-size="9.5">plugin · claims ctx.agents</text>
    <text x="210" y="566" text-anchor="middle" fill="#64748b" font-size="8.5">who is alive right now</text>
    <line x1="300" y1="500" x2="400" y2="392" stroke="#F59E0B" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

    <rect x="420" y="500" width="260" height="78" rx="10" fill="#1e3a5f" stroke="#EF4444" stroke-width="1.4"/>
    <text x="550" y="530" text-anchor="middle" fill="#fca5a5" font-size="12.5" font-weight="bold">LLM Adapter</text>
    <text x="550" y="550" text-anchor="middle" fill="#94a3b8" font-size="9.5">plugin · claims ctx.llm</text>
    <text x="550" y="566" text-anchor="middle" fill="#64748b" font-size="8.5">provider swaps live here</text>
    <line x1="550" y1="500" x2="550" y2="392" stroke="#EF4444" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

    <rect x="760" y="500" width="260" height="78" rx="10" fill="#1e3a5f" stroke="#F59E0B" stroke-width="1.4"/>
    <text x="890" y="530" text-anchor="middle" fill="#fcd34d" font-size="12.5" font-weight="bold">Shell / Fs / Sandbox</text>
    <text x="890" y="550" text-anchor="middle" fill="#94a3b8" font-size="9.5">plugins · claim ctx.* backends</text>
    <text x="890" y="566" text-anchor="middle" fill="#64748b" font-size="8.5">where code runs</text>
    <line x1="800" y1="500" x2="700" y2="392" stroke="#F59E0B" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- Takeaway -->
  <text x="550" y="620" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui">Extending dsh = mounting a new plugin beside these. No package is more special than another — there is no core to patch.</text>
</svg>