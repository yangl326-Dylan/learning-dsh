<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" fill="none">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1100" height="680" rx="12" fill="#0f172a"/>
  <text x="550" y="36" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="system-ui">Extension Map — where new behavior goes</text>

  <!-- Map metaphor -->
  <text x="60" y="62" fill="#94a3b8" font-size="11" font-weight="bold" font-family="system-ui">the mechanism map — landmarks to attach new behavior (extend by registering, never by editing)</text>

  <!-- Extension points (landmarks) -->
  <g font-family="system-ui">
    <!-- ctx.llm -->
    <rect x="60" y="80" width="480" height="96" rx="10" fill="#1e3a5f" opacity="0.35" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="80" y="104" fill="#93c5fd" font-size="11" font-weight="bold">ctx.llm</text>
    <text x="80" y="122" fill="#64748b" font-size="9">add a model provider</text>
    <text x="80" y="140" fill="#64748b" font-size="9">register its adapter here</text>
    <text x="80" y="158" fill="#475569" font-size="8.5">model providers · adapters</text>

    <!-- ctx.tools -->
    <rect x="560" y="80" width="480" height="96" rx="10" fill="#3b1e5f" opacity="0.35" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="580" y="104" fill="#c4b5fd" font-size="11" font-weight="bold">ctx.tools</text>
    <text x="580" y="122" fill="#64748b" font-size="9">add a model-facing capability</text>
    <text x="580" y="140" fill="#64748b" font-size="9">register it — schema joins prompt assembly</text>
    <text x="580" y="158" fill="#475569" font-size="8.5">scoped registry · tools · schemas</text>

    <!-- ctx.shell -->
    <rect x="60" y="192" width="480" height="96" rx="10" fill="#1e3a2e" opacity="0.35" stroke="#10B981" stroke-width="1.5"/>
    <text x="80" y="216" fill="#6ee7b7" font-size="11" font-weight="bold">ctx.shell</text>
    <text x="80" y="234" fill="#64748b" font-size="9">add shell execution</text>
    <text x="80" y="252" fill="#64748b" font-size="9">register a backend</text>
    <text x="80" y="270" fill="#475569" font-size="8.5">execution worlds · sandboxes</text>

    <!-- events -->
    <rect x="560" y="192" width="480" height="96" rx="10" fill="#3b1e2e" opacity="0.35" stroke="#EF4444" stroke-width="1.5"/>
    <text x="580" y="216" fill="#fca5a5" font-size="11" font-weight="bold">events (chapter 4)</text>
    <text x="580" y="234" fill="#64748b" font-size="9">session · agent · capability domains</text>
    <text x="580" y="252" fill="#64748b" font-size="9">attach policy to seams</text>
    <text x="580" y="270" fill="#475569" font-size="8.5">listeners · dispatch modes</text>
  </g>

  <!-- The rule -->
  <rect x="60" y="306" width="980" height="66" rx="10" fill="#0b1526" stroke="#F59E0B" stroke-width="1.4"/>
  <text x="80" y="330" fill="#fcd34d" font-size="11" font-weight="bold" font-family="system-ui">the rule: register, never edit</text>
  <text x="80" y="350" fill="#94a3b8" font-size="9">the loop code never changes for a new capability · attach it and it participates, detach it and nothing else moves</text>
  <text x="80" y="364" fill="#64748b" font-size="8.5">(like plugging in a new appliance — the wiring in the wall stays untouched)</text>

  <!-- Version pinning -->
  <g font-family="system-ui">
    <rect x="60" y="392" width="980" height="140" rx="10" fill="#1e293b" opacity="0.5" stroke="#475569" stroke-width="1.4"/>
    <text x="80" y="416" fill="#94a3b8" font-size="11" font-weight="bold">why lock to a version (preview-versioning)</text>
    <text x="80" y="438" fill="#64748b" font-size="9">dsh is in developer preview — compatibility-breaking changes will come, and they are expected</text>

    <rect x="80" y="452" width="440" height="56" rx="8" fill="#0f1f33" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="300" y="476" text-anchor="middle" fill="#e2e8f0" font-size="9.5">content locks to a sourceRef commit</text>
    <text x="300" y="494" text-anchor="middle" fill="#64748b" font-size="8.5">a chapter always points at the exact code it describes</text>

    <rect x="560" y="452" width="440" height="56" rx="8" fill="#0f1f33" stroke="#10B981" stroke-width="1.2"/>
    <text x="780" y="476" text-anchor="middle" fill="#e2e8f0" font-size="9.5">new versions are added alongside</text>
    <text x="780" y="494" text-anchor="middle" fill="#64748b" font-size="8.5">never overwriting the old content</text>
  </g>

  <!-- Takeaway -->
  <text x="550" y="660" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui">The map is a contract: if your goal is not on it, you are probably changing the loop — or should be.</text>
</svg>