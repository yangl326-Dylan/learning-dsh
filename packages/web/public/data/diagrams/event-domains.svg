<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" fill="none">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1100" height="660" rx="12" fill="#0f172a"/>
  <text x="550" y="36" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="system-ui">Event Domains — durable facts vs live interception</text>

  <!-- Domain 1: SESSION -->
  <g font-family="system-ui">
    <rect x="40" y="64" width="1020" height="150" rx="10" fill="#1e3a5f" opacity="0.3" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="5,3"/>
    <text x="60" y="88" fill="#93c5fd" font-size="12" font-weight="bold">SESSION — durable facts · like a ledger</text>
    <text x="60" y="104" fill="#64748b" font-size="9">appended to the log, survive reload · use when the fact must persist</text>

    <rect x="60" y="118" width="180" height="44" rx="6" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1"/>
    <text x="150" y="136" text-anchor="middle" fill="#e2e8f0" font-size="9.5">turn/start</text>
    <text x="150" y="152" text-anchor="middle" fill="#64748b" font-size="8">opens a turn</text>

    <rect x="260" y="118" width="180" height="44" rx="6" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1"/>
    <text x="350" y="136" text-anchor="middle" fill="#e2e8f0" font-size="9.5">user/message</text>
    <text x="350" y="152" text-anchor="middle" fill="#64748b" font-size="8">appended input</text>

    <rect x="460" y="118" width="180" height="44" rx="6" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1"/>
    <text x="550" y="136" text-anchor="middle" fill="#e2e8f0" font-size="9.5">assistant/chunk</text>
    <text x="550" y="152" text-anchor="middle" fill="#64748b" font-size="8">token-level fidelity</text>

    <rect x="660" y="118" width="180" height="44" rx="6" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1"/>
    <text x="750" y="136" text-anchor="middle" fill="#e2e8f0" font-size="9.5">tool/result</text>
    <text x="750" y="152" text-anchor="middle" fill="#64748b" font-size="8">guarded execution</text>

    <rect x="860" y="118" width="180" height="44" rx="6" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1"/>
    <text x="950" y="136" text-anchor="middle" fill="#e2e8f0" font-size="9.5">step/end · turn/end</text>
    <text x="950" y="152" text-anchor="middle" fill="#64748b" font-size="8">recorded, never rewritten</text>
  </g>

  <!-- Domain 2: AGENT -->
  <g font-family="system-ui">
    <rect x="40" y="232" width="1020" height="150" rx="10" fill="#3b1e5f" opacity="0.3" stroke="#8B5CF6" stroke-width="1.6" stroke-dasharray="5,3"/>
    <text x="60" y="256" fill="#c4b5fd" font-size="12" font-weight="bold">AGENT — live interception · like watching a live broadcast</text>
    <text x="60" y="272" fill="#64748b" font-size="9">carry a live Agent · observe or intercept work in flight · not for history</text>

    <rect x="60" y="286" width="230" height="44" rx="6" fill="#3b1e5f" stroke="#8B5CF6" stroke-width="1"/>
    <text x="175" y="304" text-anchor="middle" fill="#e2e8f0" font-size="9.5">agent/pre-step</text>
    <text x="175" y="320" text-anchor="middle" fill="#64748b" font-size="8">waterfall around a step</text>

    <rect x="310" y="286" width="230" height="44" rx="6" fill="#3b1e5f" stroke="#8B5CF6" stroke-width="1"/>
    <text x="425" y="304" text-anchor="middle" fill="#e2e8f0" font-size="9.5">agent/request</text>
    <text x="425" y="320" text-anchor="middle" fill="#64748b" font-size="8">waterfall around the model call</text>

    <rect x="560" y="286" width="230" height="44" rx="6" fill="#3b1e5f" stroke="#8B5CF6" stroke-width="1"/>
    <text x="675" y="304" text-anchor="middle" fill="#e2e8f0" font-size="9.5">agent/turn-stopping</text>
    <text x="675" y="320" text-anchor="middle" fill="#64748b" font-size="8">serial, no next() — owns the decision</text>

    <rect x="810" y="286" width="230" height="44" rx="6" fill="#3b1e5f" stroke="#8B5CF6" stroke-width="1"/>
    <text x="925" y="304" text-anchor="middle" fill="#e2e8f0" font-size="9.5">carries a live Agent</text>
    <text x="925" y="320" text-anchor="middle" fill="#64748b" font-size="8">observe or intercept</text>
  </g>

  <!-- Domain 3: CAPABILITY -->
  <g font-family="system-ui">
    <rect x="40" y="400" width="1020" height="150" rx="10" fill="#1e3a5f" opacity="0.3" stroke="#10B981" stroke-width="1.6" stroke-dasharray="5,3"/>
    <text x="60" y="424" fill="#6ee7b7" font-size="12" font-weight="bold">CAPABILITY — seams · like power outlets</text>
    <text x="60" y="440" fill="#64748b" font-size="9">attach policy and adapters without importing the loop or knowing the provider</text>

    <rect x="60" y="454" width="230" height="44" rx="6" fill="#1e3a5f" stroke="#10B981" stroke-width="1"/>
    <text x="175" y="472" text-anchor="middle" fill="#e2e8f0" font-size="9.5">fs/*</text>
    <text x="175" y="488" text-anchor="middle" fill="#64748b" font-size="8">filesystem providers</text>

    <rect x="310" y="454" width="230" height="44" rx="6" fill="#1e3a5f" stroke="#10B981" stroke-width="1"/>
    <text x="425" y="472" text-anchor="middle" fill="#e2e8f0" font-size="9.5">tools/*</text>
    <text x="425" y="488" text-anchor="middle" fill="#64748b" font-size="8">pre/execute/post policy</text>

    <rect x="560" y="454" width="230" height="44" rx="6" fill="#1e3a5f" stroke="#10B981" stroke-width="1"/>
    <text x="675" y="472" text-anchor="middle" fill="#e2e8f0" font-size="9.5">telemetry/*</text>
    <text x="675" y="488" text-anchor="middle" fill="#64748b" font-size="8">observability seams</text>

    <rect x="810" y="454" width="230" height="44" rx="6" fill="#1e3a5f" stroke="#10B981" stroke-width="1"/>
    <text x="925" y="472" text-anchor="middle" fill="#e2e8f0" font-size="9.5">shell · sandbox · …</text>
    <text x="925" y="488" text-anchor="middle" fill="#64748b" font-size="8">execution worlds</text>
  </g>

  <!-- Dispatch modes legend -->
  <rect x="40" y="570" width="1020" height="62" rx="10" fill="#0b1526" stroke="#475569" stroke-width="1.2"/>
  <text x="60" y="592" fill="#94a3b8" font-size="10" font-weight="bold" font-family="system-ui">Four dispatch modes (@mode):</text>
  <g font-family="system-ui">
    <text x="280" y="592" fill="#e2e8f0" font-size="9.5">emit</text>
    <text x="310" y="592" fill="#64748b" font-size="8.5">observe only</text>
    <text x="440" y="592" fill="#e2e8f0" font-size="9.5">waterfall</text>
    <text x="500" y="592" fill="#64748b" font-size="8.5">wrap in order, next()</text>
    <text x="650" y="592" fill="#e2e8f0" font-size="9.5">parallel</text>
    <text x="700" y="592" fill="#64748b" font-size="8.5">all run, all awaited</text>
    <text x="840" y="592" fill="#e2e8f0" font-size="9.5">serial</text>
    <text x="880" y="592" fill="#64748b" font-size="8.5">in order, value passes</text>
  </g>

  <!-- Takeaway -->
  <text x="550" y="652" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui">Picking the right event domain is the first decision in most changes to dsh.</text>
</svg>