<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" fill="none">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1100" height="680" rx="12" fill="#0f172a"/>
  <text x="550" y="36" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="system-ui">Turn Flow — steps inside turns, extension points in violet</text>

  <!-- STEP container (turn) -->
  <rect x="30" y="60" width="1040" height="430" rx="12" fill="#1e293b" opacity="0.5" stroke="#475569" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="50" y="82" fill="#94a3b8" font-size="11" font-weight="bold" font-family="system-ui">a TURN — one whole conversation (zero or more steps)</text>

  <!-- Row 1: main flow -->
  <g font-family="system-ui">
    <rect x="50" y="100" width="200" height="52" rx="26" fill="#1e3a5f" stroke="#F59E0B" stroke-width="1.6"/>
    <text x="150" y="131" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">user input</text>
    <line x1="250" y1="126" x2="320" y2="126" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="322" y="100" width="200" height="52" rx="8" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1.4"/>
    <text x="422" y="122" text-anchor="middle" fill="#93c5fd" font-size="10">turn/start</text>
    <text x="422" y="138" text-anchor="middle" fill="#64748b" font-size="8.5">durable fact · opens the turn</text>
    <line x1="522" y1="126" x2="592" y2="126" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="594" y="100" width="210" height="52" rx="8" fill="#1e3a5f" stroke="#475569" stroke-width="1.4"/>
    <text x="699" y="122" text-anchor="middle" fill="#e2e8f0" font-size="10">claim next-step input</text>
    <text x="699" y="138" text-anchor="middle" fill="#64748b" font-size="8.5">user message or tool continuation</text>
    <line x1="804" y1="126" x2="874" y2="126" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="876" y="100" width="180" height="52" rx="8" fill="#1e3a5f" stroke="#475569" stroke-width="1.4"/>
    <text x="966" y="122" text-anchor="middle" fill="#e2e8f0" font-size="10">assemble prompt</text>
    <text x="966" y="138" text-anchor="middle" fill="#64748b" font-size="8.5">systemPrompt + tool schemas</text>
    <line x1="966" y1="152" x2="966" y2="212" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  </g>

  <!-- Row 2: step execution -->
  <g font-family="system-ui">
    <!-- STEP badge -->
    <rect x="50" y="196" width="120" height="52" rx="8" fill="#0b1526" stroke="#F59E0B" stroke-width="1.4"/>
    <text x="110" y="218" text-anchor="middle" fill="#fcd34d" font-size="10.5" font-weight="bold">one STEP</text>
    <text x="110" y="236" text-anchor="middle" fill="#64748b" font-size="8">round of Q&amp;A</text>
    <line x1="170" y1="222" x2="215" y2="222" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="217" y="196" width="210" height="52" rx="8" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1.4"/>
    <text x="322" y="218" text-anchor="middle" fill="#93c5fd" font-size="10">step/start</text>
    <text x="322" y="234" text-anchor="middle" fill="#64748b" font-size="8.5">derive history from log</text>
    <line x1="427" y1="222" x2="497" y2="222" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="499" y="196" width="210" height="52" rx="8" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1.4"/>
    <text x="604" y="218" text-anchor="middle" fill="#93c5fd" font-size="10">user/message (appended)</text>
    <text x="604" y="234" text-anchor="middle" fill="#64748b" font-size="8.5">input on the log — model-visible</text>
    <line x1="709" y1="222" x2="779" y2="222" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="781" y="196" width="210" height="52" rx="8" fill="#3b1e5f" stroke="#8B5CF6" stroke-width="1.4"/>
    <text x="886" y="218" text-anchor="middle" fill="#c4b5fd" font-size="10">agent/request (waterfall)</text>
    <text x="886" y="234" text-anchor="middle" fill="#64748b" font-size="8.5">wrap the model request</text>
    <line x1="886" y1="248" x2="886" y2="308" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  </g>

  <!-- Row 3: streaming + tools -->
  <g font-family="system-ui">
    <rect x="50" y="310" width="230" height="52" rx="8" fill="#1e3a5f" stroke="#EF4444" stroke-width="1.4"/>
    <text x="165" y="332" text-anchor="middle" fill="#fca5a5" font-size="10">llm/stream (ctx.llm)</text>
    <text x="165" y="348" text-anchor="middle" fill="#64748b" font-size="8.5">assistant/chunk appended</text>
    <line x1="280" y1="336" x2="350" y2="336" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="352" y="310" width="230" height="52" rx="8" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1.4"/>
    <text x="467" y="332" text-anchor="middle" fill="#93c5fd" font-size="10">assistant/message</text>
    <text x="467" y="348" text-anchor="middle" fill="#64748b" font-size="8.5">assembled, carries usage</text>
    <line x1="582" y1="336" x2="652" y2="336" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="654" y="310" width="210" height="52" rx="8" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1.4"/>
    <text x="759" y="332" text-anchor="middle" fill="#93c5fd" font-size="10">tool/call</text>
    <text x="759" y="348" text-anchor="middle" fill="#64748b" font-size="8.5">model asks for a tool</text>
    <line x1="864" y1="336" x2="920" y2="336" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="922" y="292" width="150" height="88" rx="8" fill="#1e3a5f" stroke="#10B981" stroke-width="1.4"/>
    <text x="997" y="314" text-anchor="middle" fill="#6ee7b7" font-size="10">tools/* pipeline</text>
    <text x="997" y="332" text-anchor="middle" fill="#94a3b8" font-size="8.5">pre-execute</text>
    <text x="997" y="348" text-anchor="middle" fill="#94a3b8" font-size="8.5">execute</text>
    <text x="997" y="364" text-anchor="middle" fill="#94a3b8" font-size="8.5">post-execute</text>
  </g>

  <!-- Row 4: end of step -->
  <g font-family="system-ui">
    <line x1="620" y1="380" x2="620" y2="430" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="480" y="432" width="280" height="52" rx="8" fill="#1e3a5f" stroke="#3B82F6" stroke-width="1.4"/>
    <text x="620" y="454" text-anchor="middle" fill="#93c5fd" font-size="10">tool/result · step/end</text>
    <text x="620" y="470" text-anchor="middle" fill="#64748b" font-size="8.5">durable facts · may imply continuation</text>
  </g>

  <!-- Stop point -->
  <g font-family="system-ui">
    <rect x="210" y="432" width="250" height="52" rx="8" fill="#3b1e5f" stroke="#8B5CF6" stroke-width="1.6"/>
    <text x="335" y="454" text-anchor="middle" fill="#c4b5fd" font-size="10">agent/turn-stopping (stop button)</text>
    <text x="335" y="470" text-anchor="middle" fill="#64748b" font-size="8.5">serial, no next() — owns the decision</text>
    <line x1="478" y1="458" x2="478" y2="458" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  </g>

  <!-- Loop back -->
  <path d="M 620 484 C 620 560 620 580 160 580 C 60 580 60 300 150 154" stroke="#F59E0B" stroke-width="1.6" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow-loop)"/>
  <text x="380" y="572" text-anchor="middle" fill="#fcd34d" font-size="10" font-family="system-ui">loop until the turn is owed nothing</text>

  <!-- Takeaway -->
  <text x="550" y="660" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui">A step = one model request + the tools it calls. A turn = zero or more steps, closed once nothing is owed.</text>
</svg>